name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # Backend Testing
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Cache Python dependencies
      uses: actions/cache@v7
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        cd backend
        pip install flake8 black mypy
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check .
    
    - name: Run tests with coverage
      env:
        DJANGO_SETTINGS_MODULE: backend.settings
        SECRET_KEY: test-secret-key
        DEBUG: False
      run: |
        cd backend
        pip install pytest pytest-django pytest-cov pytest-asyncio
        pytest tests/ --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
    
    - name: Run security checks
      run: |
        cd backend
        pip install safety bandit
        safety check
        bandit -r . -x ./tests
  
  # Frontend Testing
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
    
    - name: Cache Node modules
      uses: actions/cache@v7
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linting
      run: |
        cd frontend
        npm run lint
    
    - name: Build application
      run: |
        cd frontend
        npm run build
    
    - name: Run type checking
      run: |
        cd frontend
        npx tsc --noEmit
  
  # Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run integration tests
      run: |
        cd backend
        python manage.py migrate
        python manage.py runserver &
        sleep 5
        pytest tests/test_enterprise_features.py -v
  
  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v7
    
    - name: Build backend Docker image
      run: |
        cd backend
        docker build -t multi-agent-backend:latest .
    
    - name: Build frontend Docker image
      run: |
        cd frontend
        docker build -t multi-agent-frontend:latest .
  
  # Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install locust
    
    - name: Run load tests
      run: |
        cd backend
        python manage.py migrate
        python manage.py runserver &
        sleep 5
        locust -f tests/load_test.py --headless -u 100 -r 10 -t 1m --host=http://localhost:8000
  
  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build, performance-tests]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
  
  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, performance-tests]
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment commands here
