# Cloud Build → Artifact Registry → Cloud Run API + Celery worker
# Stack: Vercel (frontend) + Neon/Supabase (Postgres) + Upstash (Redis)
# No Cloud SQL / Memorystore / VPC required.
#
#   gcloud builds submit --config=deploy/gcp/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=multi-agent

substitutions:
  _REGION: us-central1
  _REPO: multi-agent
  _SERVICE: multi-agent-api
  _WORKER_SERVICE: multi-agent-worker
  _MEMORY: 2Gi
  _CPU: "2"
  # Lean defaults: API scales to zero; worker stays warm enough to drain queue
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"
  _WORKER_MIN_INSTANCES: "0"
  _WORKER_MAX_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - ./backend

  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest

  # Public HTTPS API (ASGI + WebSockets)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --timeout=300
      - --concurrency=40
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu-boost
      - --session-affinity
      - --set-env-vars=DEBUG=False,SECURE_SSL_REDIRECT=False,LOG_TO_FILE=False,SERVICE_ROLE=web,RUN_MIGRATIONS=true,GUNICORN_WORKERS=1,DB_CONN_MAX_AGE=0
      - --set-secrets=SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,CELERY_BROKER_URL=celery-broker-url:latest,CELERY_RESULT_BACKEND=celery-result-backend:latest,ALLOWED_HOSTS=allowed-hosts:latest,JWT_SECRET=jwt-secret:latest,CORS_ALLOWED_ORIGINS=cors-allowed-origins:latest,CSRF_TRUSTED_ORIGINS=csrf-trusted-origins:latest,FRONTEND_URL=frontend-url:latest,GROQ_API_KEY=groq-api-key:latest,OPENAI_API_KEY=openai-api-key:latest

  # Celery worker (same image, SERVICE_ROLE=worker)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8000
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --timeout=3600
      - --concurrency=1
      - --min-instances=${_WORKER_MIN_INSTANCES}
      - --max-instances=${_WORKER_MAX_INSTANCES}
      - --no-cpu-throttling
      - --set-env-vars=DEBUG=False,SECURE_SSL_REDIRECT=False,LOG_TO_FILE=False,SERVICE_ROLE=worker,RUN_MIGRATIONS=false,CELERY_WORKERS=1,DB_CONN_MAX_AGE=0
      - --set-secrets=SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,CELERY_BROKER_URL=celery-broker-url:latest,CELERY_RESULT_BACKEND=celery-result-backend:latest,ALLOWED_HOSTS=allowed-hosts:latest,JWT_SECRET=jwt-secret:latest,GROQ_API_KEY=groq-api-key:latest,OPENAI_API_KEY=openai-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
