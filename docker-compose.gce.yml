# Backend-only stack for a GCP Compute Engine VM (no frontend).
# Postgres/Redis stay on the Docker network — only API port 8000 is published.
#
# On the VM:
#   cp deploy/gcp/.env.gcp.example .env.gcp
#   # set SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD, ALLOWED_HOSTS=<VM external IP>
#   docker compose -f docker-compose.gce.yml --env-file .env.gcp up -d --build

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-multi_agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - gce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multi_agent_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - gce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to VM IP or domain}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multi_agent_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      BACKEND_URL: ${BACKEND_URL:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      LOG_TO_FILE: "False"
      SERVICE_ROLE: web
      RUN_MIGRATIONS: "true"
      PORT: "8000"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multi_agent_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_TO_FILE: "False"
      SERVICE_ROLE: worker
      RUN_MIGRATIONS: "false"
      CELERY_WORKERS: ${CELERY_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multi_agent_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LOG_TO_FILE: "False"
      SERVICE_ROLE: beat
      RUN_MIGRATIONS: "false"
    depends_on:
      - celery_worker

volumes:
  gce_postgres_data:
  gce_redis_data:
